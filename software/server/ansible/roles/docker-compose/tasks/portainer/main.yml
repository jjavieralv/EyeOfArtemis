---
###############
# Config vars #
###############
- name: Include portainer vars
  ansible.builtin.include_vars:
    dir: portainer
    extensions:
      - yml
  tags: always

##################
# Config portainer #
##################

- name: Delete portainer
  tags: delete
  block:
    - name: Docker compose portainer down
      ansible.builtin.debug:
        msg: "Down frigate with delete..."
      changed_when: true
      notify: "compose down delete"

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Delete configs
      loop:
        - "{{ portainer_main.path }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent

- name: Config portainer
  tags: config
  block:
    - name: Create portainer dirs
      loop:
        - "{{ portainer_main.path }}"
        - "{{ main_paths.config.path }}"
        - "{{ docker_compose.project.path }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ dockercompose_user }}"
        mode: "0755"

    - name: Copy portainer docker_compose template
      ansible.builtin.template:
        src: "files/portainer/docker-compose/docker-compose.yml.j2"
        dest: "{{ docker_compose.project.path }}/docker-compose.yml"
        owner: "{{ dockercompose_user }}"
        mode: "0644"

    #- name: Ensure directory structure exists
    #  ansible.builtin.file:
    #    path: "{{ main_paths.config.path }}/{{ item.path }}"
    #    state: directory
    #    mode: "0755"
    #  with_community.general.filetree: "files/portainer/configs/"
    #  when: item.state == 'directory'
    #
    #- name: Ensure files are populated from templates
    #  ansible.builtin.template:
    #    src: "{{ item.src }}"
    #    dest: "{{ main_paths.config.path }}/{{ item.path }}"
    #    mode: "0755"
    #  with_community.general.filetree: "files/portainer/configs/"
    #  when: item.state == 'file'

##################
# Manage Frigate #
##################

- name: Docker compose portainer up
  ansible.builtin.debug:
    msg: "Up portainer..."
  changed_when: true
  notify: compose up
  tags: up

- name: Docker compose portainer down
  ansible.builtin.debug:
    msg: "Down portainer..."
  changed_when: true
  notify: "compose down"
  tags: down

- name: Docker compose portainer restart
  ansible.builtin.debug:
    msg: "restart portainer..."
  changed_when: true
  notify: "compose restart"
  tags: restart

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
