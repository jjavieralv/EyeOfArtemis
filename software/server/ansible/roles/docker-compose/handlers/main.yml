---
- name: Compose down
  # become_user: "{{dockercompose_user}}"
  become: true
  ansible.builtin.command:
    argv:
      - "docker"
      - "compose"
      - "down"
    chdir: "{{ docker_compose.project.path }}"
  listen: "compose down"

- name: Compose up
  # become_user: "{{ dockercompose_user }}"
  become: true
  ansible.builtin.command:
    argv:
      - "docker"
      - "compose"
      - "up"
      - "--detach"
    chdir: "{{ docker_compose.project.path }}"
  listen: "compose up"

- name: Compose down delete
  # become_user: "{{ dockercompose_user }}"
  become: true
  ansible.builtin.command:
    argv:
      - "docker"
      - "compose"
      - "down"
      - "-v"
    chdir: "{{ docker_compose.project.path }}"
  listen: "compose down delete"

# Some hwcel boards stops working when restart, thats why we do down and up

- name: Compose restart
  become: true
  # become_user: "{{ dockercompose_user }}"
  block:
    - name: Docker compose restart 1/2 DOWN
      ansible.builtin.debug:
        msg: "Down service..."
      notify: "compose down"
      changed_when: true
      listen: "compose restart"

    - name: Docker compose restart 2/2 UP
      ansible.builtin.debug:
        msg: "up service..."
      notify: "compose up"
      changed_when: true
      listen: "compose restart"
