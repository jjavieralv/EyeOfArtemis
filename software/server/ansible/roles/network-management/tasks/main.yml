---

- name: Include vars
  tags: always
  ansible.builtin.include_vars:
    file: vars/main.yml

- name: Networking Config
  tags: network-config
  ansible.builtin.include_tasks:
    file: network-config.yml

- name: Prepare Network packages
  tags: packages_config
  loop: "{{ network_packages }}"
  ansible.builtin.include_tasks:
    file: "{{ item }}.yml"
